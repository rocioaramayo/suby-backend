spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 80MB

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=suby;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:subyuser}
    password: ${DB_PASSWORD:Suby123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

application:
  security:
    jwt:
      secretKey: ${JWT_SECRET:suby_super_secret_key_suby_super_secret_key_2026}
      expiration: 86400000
